services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    group_add:
      - "983"
    ports:
      - "8080:8080"
    volumes:
      - /usr/bin/docker:/usr/bin/docker
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devsecops
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devsecops

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: ${SONAR_JDBC_URL}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - devsecops

  db:
    image: postgres:16
    container_name: job_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${JOB_TRACKER_DB_USER}
      POSTGRES_PASSWORD: ${JOB_TRACKER_DB_PASSWORD}
      POSTGRES_DB: ${JOB_TRACKER_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - job_tracker_data:/var/lib/postgresql/data
    networks:
      - devsecops

networks:
  devsecops:
    name: devsecops

volumes:
  postgres_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  jenkins_home:
  job_tracker_data:
